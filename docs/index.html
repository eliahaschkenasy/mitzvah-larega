<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17362e" />
    <meta
      name="description"
      content="לחיצה אחת לקבלת מצווה אקראית, הסבר קצר ורעיון מעשי להיום."
    />
    <title>מצווה לרגע — מצווה אקראית ליום טוב יותר</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="site-shell">
      <div class="sun-glow" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="#top" aria-label="מצווה לרגע — ראש הדף">
          <span class="brand-mark" aria-hidden="true">מ</span>
          <span>מצווה לרגע</span>
        </a>
        <span class="edition">רעיון קטן ליום גדול</span>
      </header>

      <section class="hero" id="top">
        <h1>איזו מצווה<br /><span>מחכה לך היום?</span></h1>

        <button class="choose-button" id="choose-button" type="button">
          <span id="button-label">בחרו לי מצווה</span>
          <span class="button-icon" aria-hidden="true">✦</span>
        </button>
        <noscript>כדי לבחור מצווה אקראית, יש להפעיל JavaScript בדפדפן.</noscript>
      </section>

      <section
        class="result-area"
        id="result-area"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="waiting-mark" aria-hidden="true"><span>✦</span></div>
      </section>

      <footer>
        <span>תשפ״ז</span>
      </footer>
    </main>
  </body>
</html>
